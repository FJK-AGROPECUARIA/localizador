<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Localizar Animal</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="Localizar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="icon" href="icone-192.png">
<style>
  :root { --verde:#11253d; --lima:#a7bc09; --verde2:#f3f7dc; --texto:#11253d; --cinza:#5d6b7a; --borda:#dde3ea; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:#f4f7f5; color:var(--texto); }
  header { background:#fff; padding:16px 16px 12px; text-align:center; border-bottom:4px solid var(--lima); }
  header img { width:200px; max-width:60%; height:auto; display:block; margin:0 auto 8px; }
  header h1 { margin:0; font-size:19px; color:var(--verde); }
  header p { margin:3px 0 0; font-size:13px; color:var(--cinza); }
  main { max-width:480px; margin:0 auto; padding:16px; }
  label { display:block; font-size:13px; color:var(--cinza); margin:0 0 6px; }
  input { width:100%; font-size:20px; padding:14px; border:1px solid var(--borda); border-radius:10px; background:#fff; }
  input:focus { outline:2px solid var(--verde); border-color:transparent; }
  .campo { margin-bottom:12px; }
  button { width:100%; font-size:18px; padding:14px; border:0; border-radius:10px; background:var(--verde); color:#fff; font-weight:600; }
  button:disabled { opacity:.6; }
  .card { background:#fff; border:1px solid var(--borda); border-radius:12px; margin-top:16px; overflow:hidden; }
  .faz { background:var(--verde2); color:var(--verde); border-left:5px solid var(--lima); font-weight:700; font-size:18px; padding:12px 14px; }
  .linha { display:flex; justify-content:space-between; gap:12px; padding:11px 14px; border-top:1px solid var(--borda); }
  .linha span { color:var(--cinza); font-size:14px; }
  .linha b { text-align:right; font-size:16px; word-break:break-all; }
  .msg { margin-top:16px; padding:14px; border-radius:10px; background:#fff; border:1px solid var(--borda); text-align:center; color:var(--cinza); }
  .erro { color:#b3261e; border-color:#f1c4c0; background:#fdf1f0; }
  .campo-busca { position:relative; }
  .campo-busca input { padding-right:64px; font-size:20px; }
  .topo-busca { display:flex; align-items:center; gap:10px; margin:4px 0 10px; }
  .modo { flex:1; display:flex; background:#fff; border:1px solid var(--borda); border-radius:12px; padding:4px; gap:4px; }
  .modo button { flex:1; width:auto; font-size:18px; padding:10px 0; border-radius:9px; background:transparent; color:var(--cinza); font-weight:700; touch-action:manipulation; }
  .modo button.ativo { background:var(--verde); color:#fff; }
  .foto-topo { width:58px; flex:none; padding:0; height:52px; border-radius:12px; background:var(--lima); color:var(--verde); display:flex; align-items:center; justify-content:center; touch-action:manipulation; }
  .foto-topo svg { width:26px; height:26px; }
  .opcoes { margin-top:16px; background:#fff; border:1px solid var(--borda); border-radius:12px; overflow:hidden; }
  .opcoes .tit { padding:12px 14px; font-size:14px; color:var(--cinza); background:var(--verde2); border-left:5px solid var(--lima); }
  .opcoes button { display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; background:#fff; color:var(--verde); border-top:1px solid var(--borda); border-radius:0; padding:14px; font-size:17px; text-align:left; }
  .opcoes button small { color:var(--cinza); font-size:13px; font-weight:600; flex:none; }
  .marcar { margin-top:16px; background:#fff; border:1px solid var(--borda); border-radius:12px; overflow:hidden; }
  .marcar .dica { padding:12px 14px; font-size:16px; color:var(--verde); background:var(--verde2); border-left:5px solid var(--lima); }
  .marcar .area { position:relative; touch-action:manipulation; }
  .marcar .area img { display:block; width:100%; height:auto; }
  .marcar .area svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .marcar .botoes { display:flex; gap:8px; padding:10px; }
  .marcar .botoes button { flex:1; font-size:16px; padding:12px; background:var(--verde2); color:var(--verde); border:1px solid var(--lima); }
  .opcoes mark { background:var(--lima); color:var(--verde); border-radius:3px; padding:0 1px; }
  .acoes-campo { position:absolute; right:8px; top:50%; transform:translateY(-50%); display:flex; gap:6px; }
  .acoes-campo button { width:auto; padding:9px 12px; font-size:15px; border-radius:8px; background:var(--verde2); color:var(--verde); border:1px solid var(--lima); touch-action:manipulation; }
  .acoes-campo .icone { font-size:20px; padding:5px 0; width:44px; text-align:center; }
  .acoes-campo .icone svg { width:22px; height:22px; display:block; margin:0 auto; }
  .acoes-campo .foto { background:var(--lima); border-color:var(--lima); }
  .foto-lida { display:flex; gap:12px; align-items:center; background:#fff; border:1px solid var(--borda); border-left:5px solid var(--lima); border-radius:12px; padding:10px; margin-top:16px; }
  .foto-lida img { width:84px; height:84px; object-fit:cover; border-radius:8px; flex:none; background:var(--borda); }
  .foto-lida .txt { font-size:14px; color:var(--cinza); line-height:1.4; min-width:0; }
  .foto-lida .txt b { font-size:22px; color:var(--verde); word-break:break-all; }
  .outros { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .outros button { width:auto; font-size:14px; padding:6px 10px; border-radius:8px; background:var(--verde2); color:var(--verde); border:1px solid var(--lima); font-weight:600; }
  .fundo-menu { position:fixed; inset:0; background:rgba(17,37,61,.45); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .fundo-menu.oculto { display:none; }
  .menu-foto { background:#fff; width:100%; max-width:480px; border-radius:16px 16px 0 0; padding:14px 16px calc(16px + env(safe-area-inset-bottom)); display:grid; gap:10px; }
  .menu-foto h2 { margin:2px 0 4px; font-size:17px; text-align:center; color:var(--verde); }
  .menu-foto button { display:flex; align-items:center; justify-content:center; gap:10px; }
  .menu-foto button svg { width:24px; height:24px; }
  .menu-foto .galeria { background:var(--lima); color:var(--verde); }
  .menu-foto .cancelar { background:var(--verde2); color:var(--cinza); border:1px solid var(--borda); }
  .teclado { margin:0 0 12px; }
  .teclado.oculto { display:none; }
  .grade { display:grid; gap:8px; }
  .grade.num { grid-template-columns:repeat(3,1fr); }
  .grade.letras { grid-template-columns:repeat(10,1fr); gap:5px; }
  .grade.oculto { display:none; }
  .teclado button { background:#fff; color:var(--verde); border:1px solid var(--borda); font-size:28px; font-weight:600; padding:16px 0; border-radius:12px; box-shadow:0 1px 0 var(--borda); touch-action:manipulation; width:100%; }
  .grade.letras button { font-size:20px; padding:14px 0; border-radius:8px; }
  .teclado button:active { background:var(--verde2); }
  .teclado .acao { font-size:18px; color:var(--cinza); }
  .grade.letras .acao { font-size:15px; }
  .l2 { grid-column:span 2; } .l3 { grid-column:span 3; } .l4 { grid-column:span 4; } .l5 { grid-column:span 5; }
  .teclado [data-k=APAGAR] { font-size:26px; color:var(--verde); }
  .rotulo { font-size:20px; font-weight:800; color:var(--verde); margin:4px 0 10px; }
  .barra-dados { background:#fff; border:1px solid var(--borda); border-radius:12px; padding:10px 12px; margin-bottom:14px; display:flex; gap:10px; align-items:center; }
  .status { flex:1; font-size:13px; color:var(--cinza); line-height:1.35; }
  .status.erro { color:#b3261e; background:none; border:0; }
  .status b { color:var(--verde); }
  .atualizar { width:auto; flex:none; font-size:14px; padding:10px 12px; background:var(--lima); color:var(--verde); font-weight:700; }
</style>
</head>

        <input id="termo" inputmode="none" placeholder="Nº do brinco. Ex.: 11491" autocomplete="off" autocorrect="off" spellcheck="false">
        <input type="file" id="fotoCamera" accept="image/*" capture="environment" hidden>
        <input type="file" id="fotoGaleria" accept="image/*" hidden>
        <div class="acoes-campo">
          <button type="button" class="icone" id="limpar" aria-label="Limpar tudo">&#10005;</button>
        </div>
      </div>
    </div>
    <div class="teclado" id="teclado">
      <div class="grade num" id="gradeNum">
        <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button><button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button><button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
        <button type="button" class="acao" data-k="ABC">ABC</button><button type="button" data-k="0">0</button><button type="button" class="acao" data-k="APAGAR" aria-label="Apagar">&#9003;</button>
      </div>
      <div class="grade letras oculto" id="gradeLetras">
        <button type="button" data-k="Q">Q</button><button type="button" data-k="W">W</button><button type="button" data-k="E">E</button><button type="button" data-k="R">R</button><button type="button" data-k="T">T</button><button type="button" data-k="Y">Y</button><button type="button" data-k="U">U</button><button type="button" data-k="I">I</button><button type="button" data-k="O">O</button><button type="button" data-k="P">P</button>
        <button type="button" data-k="A">A</button><button type="button" data-k="S">S</button><button type="button" data-k="D">D</button><button type="button" data-k="F">F</button><button type="button" data-k="G">G</button><button type="button" data-k="H">H</button><button type="button" data-k="J">J</button><button type="button" data-k="K">K</button><button type="button" data-k="L">L</button><button type="button" data-k="-">-</button>
        <button type="button" data-k="Z">Z</button><button type="button" data-k="X">X</button><button type="button" data-k="C">C</button><button type="button" data-k="V">V</button><button type="button" data-k="B">B</button><button type="button" data-k="N">N</button><button type="button" data-k="M">M</button><button type="button" data-k="." >.</button><button type="button" data-k="/">/</button><button type="button" data-k=" " >&#9251;</button>
        <button type="button" class="acao l5" data-k="123">123</button><button type="button" class="acao l5" data-k="APAGAR" aria-label="Apagar">&#9003;</button>
      </div>
    </div>
    <button id="btn" type="submit">Buscar</button>
  </form>
  <div id="res"></div>
</main>
  <div class="fundo-menu oculto" id="fundoMenu">
    <div class="menu-foto" role="dialog" aria-label="Foto do brinco">
      <h2 id="tituloFoto">Foto do brinco</h2>
      <button type="button" data-fonte="fotoCamera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>Tirar foto</button>
      <button type="button" class="galeria" data-fonte="fotoGaleria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>Escolher foto</button>
      <button type="button" class="cancelar" data-fonte="">Cancelar</button>
    </div>
  </div>
<script>
  const $ = id => document.getElementById(id);
  /* ====== CONFIGURAÇÃO: cole aqui o link do Apps Script (termina em /exec) ====== */
  const API_URL = 'https://script.google.com/macros/s/AKfycby20LY7wxAb2CqtI-1lQHfOSnjtCNTxBUlA6HlIemr18GQj8jdkZQj9LWowpxtDGOW76w/exec';
  const CHAVE = '';   // só preencha se criar a propriedade CHAVE no Apps Script
  /* ============================================================================= */
  const pinEl = null;
  function api(params) {
    const q = new URLSearchParams(Object.assign({}, params, CHAVE ? { chave: CHAVE } : {}));
    return fetch(API_URL + '?' + q.toString(), { cache: 'no-store' }).then(r => {
      if (!r.ok) throw new Error('Erro ' + r.status);
      return r.text();
    });
  }

  const termoEl = $('termo'), teclado = $('teclado');
  const gradeNum = $('gradeNum'), gradeLetras = $('gradeLetras');
  let novo = false;
  let modo = 'brinco';   // 'brinco' ou 'chip' (sempre um dos dois marcado)
  const PLACE = { brinco: 'Nº do brinco. Ex.: 11491', chip: 'Nº do chip (mín. 5 números)' };
  function marcarModo(m) {
    modo = m;
    document.querySelectorAll('.modo button').forEach(b => { const on = b.dataset.modo === m; b.classList.toggle('ativo', on); b.setAttribute('aria-pressed', on); });
    termoEl.placeholder = PLACE[m];
    if (m === 'chip') usarLetras(false);
  }
  document.querySelector('.modo').addEventListener('click', ev => {
    const b = ev.target.closest('[data-modo]'); if (!b) return;
    marcarModo(b.dataset.modo); mostrarTeclado();
  });
  function mostrarTeclado() { teclado.classList.remove('oculto'); }
  function usarLetras(sim) {
    gradeLetras.classList.toggle('oculto', !sim);
    gradeNum.classList.toggle('oculto', sim);
  }
  function apagar() { termoEl.value = novo ? '' : termoEl.value.slice(0, -1); novo = false; }
  termoEl.addEventListener('click', mostrarTeclado);
  // Limpar: zera campo, resultado e foto (Brinco/Chip fica como o último escolhido; só abre em Brinco)
  let geracao = 0;
  function limparTudo() {
    geracao++;
    termoEl.value = ''; novo = false; fotoLida = null;
    $('res').innerHTML = '';
    $('btn').disabled = false; $('foto').disabled = false;
    fundoMenu.classList.add('oculto');
    marcarModo(modo); usarLetras(false); mostrarTeclado();   // mantém Brinco/Chip como estava
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  $('limpar').addEventListener('click', limparTudo);
  termoEl.addEventListener('input', () => { termoEl.value = termoEl.value.toUpperCase(); novo = false; });
  teclado.addEventListener('click', ev => {
    const bt = ev.target.closest('button'); if (!bt) return;
    const k = bt.dataset.k; if (!k) return;
    if (k === 'ABC') { usarLetras(true); return; }
    if (k === '123') { usarLetras(false); return; }
    if (k === 'LIMPAR') { limparTudo(); return; }
    if (k === 'APAGAR') { apagar(); return; }
    termoEl.value = (novo ? '' : termoEl.value) + k;
    novo = false;
    termoEl.scrollLeft = termoEl.scrollWidth;
  });

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ---------- base salva no celular ---------- */
  let base = null, idxBrinco = null, chips = null;
  const DB = 'localizador', LOJA = 'base';
  function abrirDB() {
    return new Promise((ok, falha) => {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(LOJA);
      r.onsuccess = () => ok(r.result); r.onerror = () => falha(r.error);
    });
  }
  async function salvarLocal(txt) {
    try { const db = await abrirDB(); await new Promise((ok, f) => { const t = db.transaction(LOJA, 'readwrite'); t.objectStore(LOJA).put(txt, 'atual'); t.oncomplete = ok; t.onerror = () => f(t.error); }); return true; }
    catch (e) { try { localStorage.setItem('baseAnimais', txt); return true; } catch (e2) { return false; } }
  }
  async function lerLocal() {
    try { const db = await abrirDB(); const v = await new Promise((ok, f) => { const r = db.transaction(LOJA).objectStore(LOJA).get('atual'); r.onsuccess = () => ok(r.result); r.onerror = () => f(r.error); }); if (v) return v; } catch (e) {}
    try { return localStorage.getItem('baseAnimais'); } catch (e) { return null; }
  }
  function carregarBase(txt) {
    const b = JSON.parse(txt);
    if (!b || !b.linhas) return false;
    const idx = {}, lista = [];
    b.linhas.forEach((l, i) => {
      const n = chaveBrinco(l[1]); if (n) (idx[n] = idx[n] || []).push(i);
      const d = soNumeros(l[2]); if (d) lista.push([d, i]);
    });
    base = b; idxBrinco = idx; chips = lista;
    return true;
  }
  const normalizar = v => String(v == null ? '' : v).replace(/\s+/g, '').toUpperCase();
  const soNumeros = v => String(v == null ? '' : v).replace(/\D/g, '');
  const chaveBrinco = v => normalizar(v).replace(/^0+(?=.)/, '');
  const MIN_CHIP = 5;
  // brinco: número exato | chip: o número digitado aparece dentro do chip completo
  function buscarLocal(termo, m) {
    if (!base) return [];
    if (m === 'brinco') return (idxBrinco[chaveBrinco(termo)] || []).slice();
    const d = soNumeros(termo); if (d.length < MIN_CHIP) return [];
    const exatos = chips.filter(c => c[0] === d || c[0].replace(/^0+/, '') === d.replace(/^0+/, '')).map(c => c[1]);
    return exatos.length ? exatos : chips.filter(c => c[0].indexOf(d) >= 0).map(c => c[1]);
  }
  const confere = (a, termo, m) => m === 'brinco'
    ? chaveBrinco(a.visual) === chaveBrinco(termo)
    : soNumeros(a.eletronica).indexOf(soNumeros(termo)) >= 0;
  const fmtData = iso => { const d = new Date(iso); const p = n => String(n).padStart(2, '0'); return p(d.getDate()) + '/' + p(d.getMonth() + 1) + ' às ' + p(d.getHours()) + ':' + p(d.getMinutes()); };
  const fmtPeso = v => v === '' || v == null ? '-' : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' kg';
  const fmtIdade = m => { if (m === '' || m == null) return '-'; m = Number(m); const a = Math.floor(m / 12), r = m % 12; return [a ? a + (a === 1 ? ' ano' : ' anos') : '', r ? r + (r === 1 ? ' mês' : ' meses') : ''].filter(Boolean).join(' e ') || '0 meses'; };
  const ou = v => (v === '' || v == null) ? '-' : v;

  function mostrarStatus(msg, erro) {
    const st = $('status');
    if (msg) { st.innerHTML = msg; st.className = 'status' + (erro ? ' erro' : ''); return; }
    if (!base) { st.innerHTML = 'Nenhum dado salvo no celular. Toque em <b>Atualizar dados</b> com internet.'; st.className = 'status erro'; return; }
    st.innerHTML = 'Dados salvos de <b>' + fmtData(base.gerado) + '</b>'
      + (base.falhas && base.falhas.length ? '<br><small>Sem dados de: ' + esc(base.falhas.join(', ')) + '</small>' : '');
    st.className = 'status';
  }

  let atualizando = false, ultimaTentativa = 0;
  async function atualizar(forcar, silencioso) {
    if (atualizando) return;
    if (silencioso && Date.now() - ultimaTentativa < 5 * 60000) return; // no máx. a cada 5 min sozinho
    ultimaTentativa = Date.now();
    if (navigator.onLine === false) { if (!silencioso) mostrarStatus('Sem internet agora. Os dados salvos continuam funcionando.', true); return; }
    atualizando = true;
    const bt = $('atualizar'); bt.disabled = true; bt.textContent = 'Atualizando…';
    if (!silencioso || !base) mostrarStatus('Atualizando…');
    try {
      const txt = await api({ acao: 'base', forcar: forcar ? '1' : '0', tem: base ? base.gerado : '' });
      const j = JSON.parse(txt);
      if (j.erro) throw new Error(j.erro);
      if (!j.igual) {
        carregarBase(txt);
        const ok = await salvarLocal(txt);
        if (!ok) { mostrarStatus('Dados carregados, mas o celular não deixou salvar.', true); return; }
      }
      mostrarStatus();
    } catch (e) {
      // com dados salvos, não mostra o erro: mantém a data da última atualização
      if (!base) mostrarStatus('Não consegui atualizar: ' + esc(e.message || e), true);
      else mostrarStatus();
    } finally {
      atualizando = false; bt.disabled = false; bt.textContent = 'Atualizar dados';
    }
  }
  $('atualizar').addEventListener('click', () => atualizar(true, false));

  function cartao(a) {
    return '<div class="card"><div class="faz">Animal ' + esc(a.visual) + '</div>'
      + '<div class="linha"><span>Brinco</span><b>' + esc(a.visual) + '</b></div>'
      + '<div class="linha"><span>Chip</span><b>' + esc(a.eletronica) + '</b></div>'
      + '<div class="linha"><span>Sexo</span><b>' + esc(a.sexo) + '</b></div>'
      + '<div class="linha"><span>Raça</span><b>' + esc(a.raca) + '</b></div>'
      + '<div class="linha"><span>Idade</span><b>' + esc(a.idade) + '</b></div>'
      + '<div class="linha"><span>Categoria</span><b>' + esc(a.categoria) + '</b></div>'
      + '<div class="linha"><span>Situação reprodutiva</span><b>' + esc(a.situacao) + '</b></div>'
      + '<div class="linha"><span>Fazenda</span><b>' + esc(a.fazenda) + '</b></div>'
      + '<div class="linha"><span>Módulo</span><b>' + esc(a.modulo) + '</b></div>'
      + '<div class="linha"><span>Área</span><b>' + esc(a.area) + '</b></div>'
      + '<div class="linha"><span>Lote</span><b>' + esc(a.lote || '-') + '</b></div>'
      + '<div class="linha"><span>Data última pesagem</span><b>' + esc(a.dataPesagem) + '</b></div>'
      + '<div class="linha"><span>Peso atual</span><b>' + esc(a.peso) + '</b></div>'
      + '<div class="linha"><span>Peso projetado</span><b>' + esc(a.pesoProjetado) + '</b></div></div>';
  }
  function deLinha(l) {
    return {
      fazenda: base.fazendas[l[0]] || '-', visual: ou(l[1]), eletronica: ou(l[2]), sexo: ou(l[3]), raca: ou(l[4]),
      idade: fmtIdade(l[5]), categoria: ou(l[6]), situacao: ou(l[7]), modulo: ou(l[8]), area: ou(l[9]),
      dataPesagem: ou(l[10]), peso: fmtPeso(l[11]), pesoProjetado: fmtPeso(l[12]), lote: /^\s*sem lote\s*$/i.test(l[13] || '') ? '' : (l[13] || ''),
    };
  }
  // lista de chips que contêm o número digitado (o trecho digitado aparece destacado)
  function listaChips(ids, termo) {
    const d = soNumeros(termo);
    // em ordem crescente do número do chip
    ids = ids.slice().sort((x, y) => { const a = soNumeros(base.linhas[x][2]), b = soNumeros(base.linhas[y][2]); return a.length - b.length || (a < b ? -1 : a > b ? 1 : 0); });
    return '<div class="opcoes"><div class="tit">' + ids.length + ' chips contêm <b>' + esc(d) + '</b>. Toque no certo:</div>'
      + ids.map(i => {
        const l = base.linhas[i], chip = String(l[2] || ''), k = chip.indexOf(d);
        const txt = k >= 0 ? esc(chip.slice(0, k)) + '<mark>' + esc(d) + '</mark>' + esc(chip.slice(k + d.length)) : esc(chip);
        return '<button type="button" data-linha="' + i + '"><span>' + txt + '</span><small>Brinco ' + esc(ou(l[1])) + '</small></button>';
      }).join('') + '</div>';
  }
  function exibir(html) {
    if (fotoLida) { html = bannerFoto(fotoLida) + html; fotoLida = null; }
    $('res').innerHTML = html;
    novo = true;
    teclado.classList.add('oculto');
    $('res').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  $('f').addEventListener('submit', ev => {
    ev.preventDefault();
    const termo = termoEl.value.trim();
    if (!termo) return;
    if (modo === 'chip' && soNumeros(termo).length < MIN_CHIP) {
      exibir('<div class="msg erro">Para buscar pelo chip, digite pelo menos ' + MIN_CHIP + ' números.</div>'); return;
    }
    const nomeBusca = modo === 'chip' ? 'chip contendo <b>' + esc(soNumeros(termo)) + '</b>' : 'brinco <b>' + esc(termo) + '</b>';
    // 1) busca nos dados salvos no celular (funciona sem internet)
    if (base) {
      const ids = buscarLocal(termo, modo);
      if (ids.length > 1 && modo === 'chip') { exibir(listaChips(ids, termo)); return; }   // vários chips: deixa escolher
      if (ids.length) { exibir(ids.map(i => cartao(deLinha(base.linhas[i]))).join('')); return; }
      if (navigator.onLine === false) {
        exibir('<div class="msg">Nenhum animal com ' + nomeBusca + ' nos dados salvos de ' + fmtData(base.gerado) + '.<br>Atualize os dados quando tiver internet.</div>');
        return;
      }
    } else if (navigator.onLine === false) {
      exibir('<div class="msg erro">Sem internet e sem dados salvos. Toque em <b>Atualizar dados</b> quando tiver sinal.</div>');
      return;
    }
    // 2) não achou no celular (ou sem dados salvos): consulta o AgroHub ao vivo
    $('btn').disabled = true;
    const g = geracao;
    $('res').innerHTML = '<div class="msg">Buscando no AgroHub…</div>';
    const termoApi = modo === 'chip' ? soNumeros(termo) : termo, modoBusca = modo;
    api({ acao: 'buscar', termo: termoApi })
      .then(txt => {
        if (g !== geracao) return;
        const r = JSON.parse(txt);
        if (r.erro) { exibir('<div class="msg erro">' + esc(r.erro) + '</div>'); return; }
        let h = '';
        const lista = (r.encontrados || []).filter(a => confere(a, termoApi, modoBusca));
        if (!lista.length) h = '<div class="msg">Nenhum animal encontrado com ' + nomeBusca + '.</div>';
        lista.forEach(a => { h += cartao(a); });
        if (r.falhas && r.falhas.length) h += '<div class="msg erro">Não consegui consultar: ' + esc(r.falhas.join(', ')) + '</div>';
        exibir(h);
      })
      .catch(e => g === geracao && exibir('<div class="msg erro">Sem conexão com o AgroHub. ' + esc(e.message || e) + '</div>'))
      .finally(() => { $('btn').disabled = false; });
  });


  // envia a foto ao Apps Script (OCR do Google) por POST
  function lerFoto(b64) {
    return fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ acao: 'foto', imagem: b64 }, CHAVE ? { chave: CHAVE } : {})) })
      .then(r => { if (!r.ok) throw new Error('Erro ' + r.status); return r.json(); });
  }
  /* ---------- foto do brinco: lê o número da foto e busca sozinho ---------- */
  let fotoLida = null;
  const fundoMenu = $('fundoMenu');
  // abre direto o menu do próprio celular (no iPhone: Fototeca, Tirar Foto, Escolher Arquivo)
  $('foto').addEventListener('click', () => { const inp = $('fotoGaleria'); inp.value = ''; inp.click(); });
  fundoMenu.addEventListener('click', ev => {   // toque fora do menu também fecha
    const bt = ev.target.closest('[data-fonte]');
    if (!bt && ev.target !== fundoMenu) return;
    fundoMenu.classList.add('oculto');
    if (bt && bt.dataset.fonte) { const inp = $(bt.dataset.fonte); inp.value = ''; inp.click(); }
  });
  function reduzirFoto(arq) {   // diminui a foto (máx. 1600 px) para enviar rápido
    return new Promise((ok, falha) => {
      const url = URL.createObjectURL(arq), im = new Image();
      im.onload = () => {
        const r = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(im.naturalWidth * r); c.height = Math.round(im.naturalHeight * r);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        ok(c.toDataURL('image/jpeg', 0.85));
      };
      im.onerror = () => { URL.revokeObjectURL(url); falha(new Error('foto')); };
      im.src = url;
    });
  }
  // só números; com Chip marcado considera só o chip, com Brinco só o brinco
  function escolherNumero(cands, m) {
    let nums = [];
    cands.map(soNumeros).forEach(v => { if (v && nums.indexOf(v) < 0) nums.push(v); });
    const ehBrinco = v => base && (idxBrinco[chaveBrinco(v)] || []).length > 0;
    const ehChip = v => base && v.length >= MIN_CHIP && buscarLocal(v, 'chip').length > 0;
    if (m === 'chip') nums = nums.filter(v => v.length >= MIN_CHIP && !ehBrinco(v)).sort((a, b) => b.length - a.length);
    else nums = nums.filter(v => v.length <= 8).map(v => v.replace(/^0+(?=.)/, '')).filter(v => ehBrinco(v) || !ehChip(v));
    const chave = v => buscarLocal(v, m).join(',');
    let achados = [];
    nums.forEach(v => { if (achados.indexOf(v) < 0 && chave(v)) achados.push(v); });
    if (m === 'chip' && base) {
      // leitura longa com 1 número errado (ex.: 5 lido como 8): acha o trecho do chip que mais se parece
      const longos = achados.filter(v => v.length >= 7), parecidos = [];
      if (!longos.length) nums.filter(v => v.length >= 7).forEach(v => {
        chips.forEach(cp => {
          const d = cp[0];
          let feito = false;
          for (let i = 0; i + v.length <= d.length && !feito; i++) {   // 1 número trocado
            let dif = 0; for (let j = 0; j < v.length && dif < 2; j++) if (d[i + j] !== v[j]) dif++;
            if (dif < 2) { const t = d.substr(i, v.length); if (parecidos.indexOf(t) < 0) parecidos.push(t); feito = true; }
          }
          if (!feito && v.length >= 8) for (let j = 0; j < v.length && !feito; j++) {   // 1 número a mais lido
            const w = v.slice(0, j) + v.slice(j + 1); if (d.indexOf(w) >= 0) { if (parecidos.indexOf(w) < 0) parecidos.push(w); feito = true; }
          }
        });
      });
      // ainda nada: soma as várias leituras (o número aparece repetido na faixa) e vê qual chip combina mais com todas
      if (!longos.length && !parecidos.length) {
        const leit = nums.filter(v => v.length >= 7 && v.length <= 12).slice(0, 10);
        if (leit.length >= 2) {
          let top = null, topN = 0, seg = 0;
          chips.forEach(cp => {
            const d = cp[0], notas = []; let jan = '', melhorL = -1;

      }
      if (!achou(c.numero)) {   // não achou: pede para digitar (mostra sugestões, se houver)
        const qual = modoFoto === 'chip' ? 'chip' : 'brinco';
        const sug = (c.outros || []).filter(v => achou(v));
        exibir(bannerFoto({ img: img }, 'Não consegui ler o número do ' + qual + ' nesta foto.<br><b style="font-size:16px">Digite o número no teclado</b> ou tire outra foto mais de perto.'
          + (sug.length ? '<div class="outros">' + sug.map(v => '<button type="button" data-outro="' + esc(v) + '">' + esc(v) + '</button>').join('') + '</div>' : '')
          + (falhaLeitor ? '<br><small>(' + esc(falhaLeitor) + ')</small>' : '')));
        mostrarTeclado();
        return;
      }
      termoEl.value = c.numero; novo = false;
      fotoLida = { img: img, numero: c.numero, outros: c.outros, modo: modoFoto };
      $('btn').click();
    } catch (e) {
      if (g !== geracao) return;
      exibir(bannerFoto({ img: img }, 'Sem conexão para ler a foto. ' + esc(e.message || e)));
    } finally { $('foto').disabled = false; }
  }

  // ao abrir: carrega o que está salvo e, se tiver internet, atualiza sozinho
  lerLocal().then(txt => { try { if (txt) carregarBase(txt); } catch (e) {} mostrarStatus(); atualizar(false, true); });
  // ao voltar para o app depois de um tempo, atualiza de novo
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') atualizar(false, true); });
  window.addEventListener('online', () => atualizar(false, true));

  // ---- atualização automática do app (troque APP_VERSAO e versao.json a cada mudança) ----
  const APP_VERSAO = '18';
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      const checar = () => reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checar(); });
      setInterval(checar, 30 * 60000);
    }).catch(() => {});
    let recarregou = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!recarregou) { recarregou = true; location.reload(); } });
  }
  async function checarVersao() {
    if (navigator.onLine === false) return;
    try {
      const r = await fetch('versao.json?t=' + Date.now(), { cache: 'no-store' });
      const v = String((await r.json()).versao || '');
      let ja = ''; try { ja = sessionStorage.getItem('recarregadoPara') || ''; } catch (e) {}
      if (v && v !== APP_VERSAO && ja !== v) {
        try { sessionStorage.setItem('recarregadoPara', v); } catch (e) {}
        location.reload();
      }
    } catch (e) {}
  }
  checarVersao();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checarVersao(); });
</script>
</body>
</html>
